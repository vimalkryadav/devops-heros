apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: assignment-s13
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: web
        image: python:3.12-alpine
        command:
        - python
        - -u
        - /app/app.py
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 96Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 3
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
        - name: data
          mountPath: /data
      volumes:
      - name: code
        configMap:
          name: web-code
      - name: data
        persistentVolumeClaim:
          claimName: web-data
