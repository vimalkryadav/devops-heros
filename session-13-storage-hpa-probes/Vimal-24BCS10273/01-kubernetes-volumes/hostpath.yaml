apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
  namespace: assignment-s13
spec:
  restartPolicy: Never
  containers:
  - name: reader
    image: busybox:1.36
    command:
    - sh
    - -c
    - test -r /node/os-release && head -5 /node/os-release; sleep 3600
    volumeMounts:
    - name: node-info
      mountPath: /node/os-release
      readOnly: true
  volumes:
  - name: node-info
    hostPath:
      path: /etc/os-release
      type: File
