apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: assignment-s13
spec:
  replicas: 4
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
      - name: load
        image: busybox:1.36
        command:
        - sh
        - -c
        - while true; do wget -q -O /dev/null -T 5 http://web-service/work; done
        resources:
          requests:
            cpu: 10m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 32Mi
