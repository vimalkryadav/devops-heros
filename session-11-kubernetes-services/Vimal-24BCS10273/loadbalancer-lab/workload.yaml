apiVersion: v1
kind: Namespace
metadata:
  name: assignment-s11-lb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-web
  namespace: assignment-s11-lb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-web
  template:
    metadata:
      labels:
        app: campus-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: campus-web-loadbalancer
  namespace: assignment-s11-lb
spec:
  type: LoadBalancer
  selector:
    app: campus-web
  ports:
    - port: 80
      targetPort: 80
