apiVersion: v1
kind: Pod
metadata:
  name: mount-demo
  namespace: assignment-s14
spec:
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - cat /config/message; sleep 3600
    volumeMounts:
    - name: config
      mountPath: /config
  volumes:
  - name: config
    configMap:
      name: mount-settings
