apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
  namespace: assignment-s14
data:
  OTHER_KEY: present
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
  namespace: assignment-s14
spec:
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - echo "APP_MODE=$APP_MODE"; sleep 3600
    env:
    - name: APP_MODE
      valueFrom:
        configMapKeyRef:
          name: app-settings
          key: APP_MODE
