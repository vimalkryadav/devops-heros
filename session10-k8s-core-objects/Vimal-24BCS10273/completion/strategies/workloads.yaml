apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-canary
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: portal-canary
      version: canary-v2
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: web
        image: busybox:1.37
        command:
        - sh
        - -c
        - mkdir -p /www; echo canary-v2 > /www/index.html; httpd -f -p 8080 -h /www
