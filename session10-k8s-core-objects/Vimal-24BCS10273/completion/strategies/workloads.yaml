apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-blue
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: portal-switch
      version: blue-v1
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: web
        image: busybox:1.37
        command:
        - sh
        - -c
        - mkdir -p /www; echo blue-v1 > /www/index.html; httpd -f -p 8080 -h /www
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 32Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 2
        ports:
        - containerPort: 8080
---
