---
apiVersion: v1
kind: Service
metadata:
  name: portal-active
spec:
  selector:
    app: portal-switch
    version: blue-v1
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: portal-release
spec:
  selector:
    app: portal-canary
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: traffic-client
spec:
  restartPolicy: Always
  containers:
  - name: app
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 7200
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
