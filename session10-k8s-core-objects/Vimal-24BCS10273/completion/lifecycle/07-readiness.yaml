apiVersion: v1
kind: Pod
metadata:
  name: lc-readiness
spec:
  restartPolicy: Always
  containers:
  - name: app
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 7200
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
    readinessProbe:
      exec:
        command:
        - test
        - -f
        - /tmp/ready
      periodSeconds: 2
      failureThreshold: 1
