apiVersion: v1
kind: Pod
metadata:
  name: lc-multi
spec:
  restartPolicy: Always
  containers:
  - name: web
    image: busybox:1.37
    command:
    - sh
    - -c
    - mkdir -p /www; echo "campus shared network" > /www/index.html; httpd -f -p 8080
      -h /www
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
  - name: client
    image: busybox:1.37
    command:
    - sh
    - -c
    - until wget -qO- http://127.0.0.1:8080; do sleep 1; done; sleep 7200
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
