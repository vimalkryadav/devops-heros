apiVersion: v1
kind: Pod
metadata:
  name: lc-succeeded
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: busybox:1.37
    command:
    - sh
    - -c
    - echo "batch finished"; exit 0
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
