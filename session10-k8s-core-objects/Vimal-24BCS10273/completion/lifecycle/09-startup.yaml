apiVersion: v1
kind: Pod
metadata:
  name: lc-startup
spec:
  restartPolicy: Always
  containers:
  - name: app
    image: busybox:1.37
    command:
    - sh
    - -c
    - echo "loading data"; sleep 20; touch /tmp/started; echo "startup complete";
      sleep 7200
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
    startupProbe:
      exec:
        command:
        - test
        - -f
        - /tmp/started
      periodSeconds: 2
      failureThreshold: 20
    livenessProbe:
      exec:
        command:
        - test
        - -f
        - /tmp/started
      periodSeconds: 2
    readinessProbe:
      exec:
        command:
        - test
        - -f
        - /tmp/started
      periodSeconds: 2
