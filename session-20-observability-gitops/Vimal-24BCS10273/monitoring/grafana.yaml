apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: assignment-s20
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
    - access: proxy
      editable: false
      isDefault: true
      name: Prometheus
      type: prometheus
      uid: prometheus
      url: http://prometheus:9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provider
  namespace: assignment-s20
data:
  provider.yaml: |
    apiVersion: 1
    providers:
    - folder: Assignment
      name: assignment
      options:
        path: /var/lib/grafana/dashboards
      type: file
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: assignment-s20
data:
  dashboard.json: '{"uid": "session20", "title": "Release Monitor \u2014 Session 20", "schemaVersion": 39, "version":
    1, "refresh": "5s", "time": {"from": "now-5m", "to": "now"}, "panels": [{"id": 1, "title": "HTTP requests per
    second", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0,
    "y": 0, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "sum(rate(lab_http_requests_total{path!=\"/metrics\",path!=\"/healthz\"}[1m]))"}],
    "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}}, {"id": 2, "title": "Application CPU cores",
    "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 0,
    "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "rate(lab_process_cpu_seconds_total[1m])"}], "fieldConfig":
    {"defaults": {"unit": "short"}, "overrides": []}}, {"id": 3, "title": "Resident memory", "type": "timeseries",
    "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}, "targets":
    [{"refId": "A", "expr": "lab_process_resident_memory_bytes"}], "fieldConfig": {"defaults": {"unit": "bytes"},
    "overrides": []}}, {"id": 4, "title": "Scrape health", "type": "timeseries", "datasource": {"type": "prometheus",
    "uid": "prometheus"}, "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "up{job=\"release-monitor\"}"}],
    "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}}]}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: assignment-s20
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
        ports:
        - name: http
          containerPort: 3000
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: datasource
          mountPath: /etc/grafana/provisioning/datasources
        - name: provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboard
          mountPath: /var/lib/grafana/dashboards
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
        env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'true'
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: Viewer
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: password
      volumes:
      - name: data
        emptyDir: {}
      - name: datasource
        configMap:
          name: grafana-datasource
      - name: provider
        configMap:
          name: grafana-provider
      - name: dashboard
        configMap:
          name: grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: assignment-s20
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: http
