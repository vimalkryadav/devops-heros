apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: assignment-s20
data:
  prometheus.yml: "global:\n  evaluation_interval: 5s\n  scrape_interval: 5s\nrule_files:\n\
    - /etc/prometheus/alerts.yml\nscrape_configs:\n- job_name: release-monitor\n \
    \ static_configs:\n  - targets:\n    - release-monitor:8000\n"
  alerts.yml: "groups:\n- name: assignment\n  rules:\n  - alert: ApplicationErrors\n\
    \    annotations:\n      summary: The assignment API is returning deliberate HTTP\
    \ 503 responses.\n    expr: sum(rate(lab_http_requests_total{status=\"503\"}[1m]))\
    \ > 0\n    for: 10s\n    labels:\n      severity: warning\n  - alert: ApplicationUnavailable\n\
    \    annotations:\n      summary: The assignment API cannot be scraped.\n    expr:\
    \ up{job=\"release-monitor\"} == 0\n    for: 15s\n    labels:\n      severity:\
    \ critical\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: assignment-s20
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: prometheus
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
        ports:
        - name: http
          containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          initialDelaySeconds: 5
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=2h
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: assignment-s20
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: http
